name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK & Widget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-assets
          VERSION_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ]; then
            VERSION_TAG="v2.0.0"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/iNotes-${VERSION_TAG}-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/iNotes-latest.apk
          ls -la release-assets/

      - name: Upload APK Artifact to Run
        uses: actions/upload-artifact@v4
        with:
          name: iNotes-Android-APK
          path: release-assets/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: i Notes Pure Native Android Release ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### 📜 i Notes v2.0.0 — 100% Pure Native Android Archival System
            
            This major release transitions i Notes from a hybrid web container to a **100% Pure Native Android Application** built with Kotlin, Jetpack Compose, Material 3, and Native SQLite WAL:
            - **100% Pure Native UI (Jetpack Compose & Material 3)**:
              - Zero WebView overhead. Instantaneous cold start and smooth 120Hz native touch animations.
              - **Notes Feed**: Staggered cards, 6 stationery paper washes (Chamois, Cream, Sage, Peach, White, Lavender), live search, and tag filtering.
              - **Stationery Canvas Editor**: Pure native notebook writing canvas with Serif headline typography, ruled guideline, paper wash selector dock, and word count & reading time tracker.
              - **Interactive Checklists**: Structured task management with progress bars and animated checkbox state.
              - **Folders & Vault Taxonomy**: Folder categorization and full JSON vault export/backup.
            - **Fixed Warm Editorial Home Screen Widget (4x2 / 4x3)**:
              - RemoteViews-compliant stationery card.
              - Instant quick-note capture via floating translucent dialog (`QuickNoteActivity`) without leaving your home screen.
              - Direct native SQLite persistence.
          files: |
            release-assets/iNotes-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
