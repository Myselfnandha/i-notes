name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Widget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/iNotes-v1.0.0-debug.apk
          ls -la release-assets/

      - name: Upload APK Artifact to Run
        uses: actions/upload-artifact@v4
        with:
          name: iNotes-Android-APK
          path: release-assets/iNotes-v1.0.0-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: i Notes Android Release ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### 📜 i Notes — Warm Editorial Archival System (Android APK)
            
            This release packages the native Android application featuring:
            - **Warm Editorial Stationery Home Screen Widget (4x2 / 4x3)**:
              - Unbleached parchment aesthetic with deckled hairline borders.
              - **Seamless blank typing area**: tap the widget space directly on your home screen to instantly bring up the keyboard and a translucent stationery card.
              - Saves immediately to the local vault and dismisses back to your home screen without entering the full app.
            - **Background Cloud & Local Sync**:
              - Automatically merges widget notes into the local IndexedDB vault.
              - Background synchronization with backend server.
            - **Full Editorial Canvas**:
              - Newsreader serif typography, 6 paper wash swatches dock, audio memos, and structured checklists.
          files: |
            release-assets/iNotes-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
